name: GitHub Pages Web App Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React SPA
        run: |
          cd web
          npm install
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cd ..

      - name: Sync gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TEMP_DEPLOY=$(mktemp -d)
          cp -R web/dist/* "$TEMP_DEPLOY/"
          touch "$TEMP_DEPLOY/.nojekyll"
          cp "$TEMP_DEPLOY/index.html" "$TEMP_DEPLOY/404.html"
          
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          
          cp -R "$TEMP_DEPLOY"/* .
          cp "$TEMP_DEPLOY/.nojekyll" .
          git add -A
          git commit -m "Deploy Web App for Commit ${{ github.sha }}" || true
          git push origin gh-pages --force || true
          git checkout -f main || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: '👉 Live App URL: https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/'
        run: |
          echo "========================================================"
          echo "LIVE APPLICATION DEPLOYED SUCCESSFULLY!"
          echo "URL: https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/"
          echo "========================================================"

      - name: Publish Deployment Summary
        run: |
          echo "# 🚀 Live Application Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Application URL:" >> $GITHUB_STEP_SUMMARY
          echo "## [https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/](https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: GitHub Pages Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL**: https://shaikrafi45.github.io/PDD-SMART-ULCER-PREDICTOR/" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Active & Live" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

